name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0 or v0.1.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: 'Force mark as prerelease (tags containing "-" are always prereleases)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates pkg-config \
            libwayland-bin wayland-protocols \
            libwayland-dev libxkbcommon-dev libcairo2-dev libpango1.0-dev \
            libfontconfig-dev libcurl4-openssl-dev \
            libjpeg-dev libpng-dev
          git clone --depth 1 https://github.com/ibireme/yyjson.git /tmp/yyjson
          cmake -S /tmp/yyjson -B /tmp/yyjson/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build /tmp/yyjson/build -j"$(nproc)"
          sudo cmake --install /tmp/yyjson/build
          rm -rf /tmp/yyjson

      - name: Lint, build, and test
        run: |
          make lint
          make release
          make test
          ./tuitube --help

      - name: Package Linux tarball
        run: |
          mkdir -p dist/tuitube-linux-x64/docs dist/tuitube-linux-x64/examples
          cp tuitube tuitube.so README.md LICENSE dist/tuitube-linux-x64/
          cp examples/tuitube.json dist/tuitube-linux-x64/tuitube.json
          cp docs/CONFIGURATION.md dist/tuitube-linux-x64/docs/CONFIGURATION.md
          cp examples/tuitube.json examples/sample_theme.json dist/tuitube-linux-x64/examples/
          tar -C dist -czf dist/tuitube-linux-x64.tar.gz tuitube-linux-x64

      - name: Upload Linux release tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: dist/tuitube-linux-x64.tar.gz
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-yyjson
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng

      - name: Lint, build, and test
        run: |
          make lint
          make release
          make test
          ./tuitube.exe --help

      - name: Package Windows portable zip
        run: |
          mkdir -p dist/tuitube-windows-x64/docs dist/tuitube-windows-x64/examples
          cp tuitube.exe tuitube.dll README.md LICENSE dist/tuitube-windows-x64/
          cp examples/tuitube.json dist/tuitube-windows-x64/tuitube.json
          cp docs/CONFIGURATION.md dist/tuitube-windows-x64/docs/CONFIGURATION.md
          cp examples/tuitube.json examples/sample_theme.json dist/tuitube-windows-x64/examples/
          ldd ./tuitube.exe ./tuitube.dll | awk '/\/ucrt64\/bin\// {print $3}' | sort -u | xargs -r cp -t dist/tuitube-windows-x64/
          (cd dist && zip -r9 tuitube-windows-x64.zip tuitube-windows-x64)

      - name: Upload Windows release zip
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/tuitube-windows-x64.zip
          retention-days: 1

  publish-release:
    runs-on: ubuntu-24.04
    needs: [build-linux, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum tuitube-windows-x64.zip tuitube-linux-x64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi

          if [ -z "$TAG" ]; then
            echo "Error: release tag is empty" >&2
            exit 1
          fi

          PRERELEASE_FLAG=""
          if [ "$INPUT_PRERELEASE" = "true" ] || echo "$TAG" | grep -q '-'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          cat > release-notes.md << 'EOF'
          Lightweight, pure-C17 YouTube client for **Linux (Wayland)** and **Windows (Win32)** — available as both a standalone desktop application and a native `mpv` C plugin.

          > [!WARNING]
          > **Runtime Dependencies Required (`mpv` and `yt-dlp` are NOT bundled)**
          > Both `tuitube-windows-x64.zip` and `tuitube-linux-x64.tar.gz` **require `mpv` (or `vlc` for standalone) and `yt-dlp` at runtime** (`ffmpeg` is recommended for merging high-resolution streams and downloads).
          >
          > - **Windows (`winget`):** `winget install shinchiro.mpv yt-dlp.yt-dlp Gyan.FFmpeg`
          > - **Windows (`scoop`):** `scoop install mpv yt-dlp ffmpeg`
          > - **Windows (local / portable):** Place `mpv.exe` & `yt-dlp.exe` beside `tuitube.exe`, or place `yt-dlp.exe` in `%APPDATA%\tuitube\` (works for both standalone and the `mpv` plugin).
          > - **Arch Linux:** `sudo pacman -S mpv yt-dlp ffmpeg`
          > - **Debian / Ubuntu:** `sudo apt install mpv yt-dlp ffmpeg`
          > - **Linux (local / no `PATH` edit):** Place `yt-dlp` (`chmod +x yt-dlp`) beside `./tuitube` or in `~/.config/tuitube/yt-dlp` (works for both standalone and `tuitube.so`), or set `"ytdlp_path"` in `tuitube.json`.

          ### Included Bundles
          - `tuitube-windows-x64.zip` — Standalone `tuitube.exe`, `mpv` plugin `tuitube.dll`, bundled MSYS2 UCRT64 runtime DLLs, starter `tuitube.json`, and `docs/CONFIGURATION.md`.
          - `tuitube-linux-x64.tar.gz` — Standalone `tuitube`, `mpv` plugin `tuitube.so`, starter `tuitube.json`, and `docs/CONFIGURATION.md`.
          - `SHA256SUMS.txt` — SHA-256 checksums for both archives.

          ### Quick Start & Customization
          - **Standalone:** Run `./tuitube` (Linux) or `tuitube.exe` (Windows).
          - **`mpv` Plugin:** Copy `tuitube.so` to `~/.config/mpv/scripts/` (Linux) or `tuitube.dll` (+ runtime DLLs) to `%APPDATA%\mpv\scripts\` (Windows), then press `F12` inside `mpv`.
          - **Configuration:** Edit the included `tuitube.json` (for example `"language": "auto"` or `"en"` / `"vi"`, `"ytdlp_path"`, `"theme"`, `"download_dir"`, etc.) — see `docs/CONFIGURATION.md` for all 27 options, `yt-dlp` placement rules, custom themes, and keybindings.

          > **Windows Security Note (Unsigned Binaries):** Release executables and DLLs are unsigned open-source builds.
          > - **Microsoft Defender SmartScreen:** Click *More info -> Run anyway*, or run `Unblock-File .\tuitube-windows-x64.zip` before extracting.
          > - **Windows 11 Smart App Control:** If SAC is **On**, unsigned binaries are blocked by Code Integrity unless SAC is turned **Off** in *Windows Security -> App & browser control -> Smart App Control settings*.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release-assets/tuitube-windows-x64.zip \
              release-assets/tuitube-linux-x64.tar.gz \
              release-assets/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              release-assets/tuitube-windows-x64.zip \
              release-assets/tuitube-linux-x64.tar.gz \
              release-assets/SHA256SUMS.txt \
              --target "$COMMIT_SHA" \
              --title "TuiTube $TAG" \
              --notes-file release-notes.md \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
